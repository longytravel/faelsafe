# Publishes the site to GitHub Pages at https://longytravel.github.io/faelsafe/
#
# This exists so there is a public URL without needing Vercel credentials. When
# the repo is connected to Vercel, that deployment serves from the domain root
# and needs no base path — NEXT_PUBLIC_BASE_PATH is only set here.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static export
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: /faelsafe
        run: npx next build

      # Stops GitHub Pages running the output through Jekyll, which would drop
      # the _next directory because its name starts with an underscore.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
